name: Build and push image

# Build manual via SSH no host era a forma anterior — substituído por este
# workflow. Atualizar manifests k8s a `ghcr.io/bernardtavares/bevox-meta-api:<sha>`
# após o run verde; rollout = `kubectl apply -f k8s/`.
#
# **Namespace**: `ghcr.io/bernardtavares/*` (mesma org do repo). Migrado de
# `ghcr.io/bevox/*` em 2026-06-04 (PR original do CI exigia PAT cross-org
# que falhava com `permission_denied: token does not match expected scopes`;
# native namespace permite usar `GITHUB_TOKEN` default sem rotação manual).
# Imagens antigas em `ghcr.io/bevox/*` permanecem no containerd k3s e nos
# manifests de prod até migração separada (não-blocking).

on:
  push:
    branches: [main]
    paths:
      # Só dispara se mudou algo que altera a imagem.
      - "src/**"
      - "db/**"
      - "scripts/**"
      - "docs/architecture/openapi.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "Dockerfile"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Override do tag (default = git short SHA)"
        required: false
        type: string
      build_migrator:
        description: "Build migrator image também"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build runtime + migrator (linux/arm64)
    # Native arm64 runner — k3s host é aarch64. Tentativa anterior com
    # ubuntu-latest x86_64 + QEMU emulation estourou os 30min de timeout
    # no primeiro build (sem cache), comprovado em run 26911820573.
    # Native arm64 reduz pra ~3-5min e dispensa QEMU.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/bernardtavares/bevox-meta-api
      PLATFORM: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_SHA:0:7}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Build tag: ${TAG}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN tem write:packages automaticamente para a org do
          # repo (bernardTavares). Sem PAT, sem rotação manual.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: ${{ env.PLATFORM }}
          build-args: |
            BUILD_SHA=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          push: true
          provenance: false
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      - name: Build & push migrator image
        if: inputs.build_migrator != false
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          platforms: ${{ env.PLATFORM }}
          tags: |
            ${{ env.IMAGE }}:migrator-${{ steps.meta.outputs.tag }}
          push: true
          provenance: false
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,scope=migrator,mode=max

      - name: Summary
        run: |
          {
            echo "## Build result"
            echo ""
            echo "Tag: \`${{ steps.meta.outputs.tag }}\`"
            echo ""
            echo "Images pushed:"
            echo "- \`${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}\`"
            if [[ "${{ inputs.build_migrator }}" != "false" ]]; then
              echo "- \`${{ env.IMAGE }}:migrator-${{ steps.meta.outputs.tag }}\`"
            fi
            echo ""
            echo "### Deploy"
            echo "Atualize \`k8s/deployment-{api,workers}.yaml\` para o novo tag e rode \`kubectl apply\`."
            echo "Para imagePullPolicy=Never (atual), faça \`k3s ctr -n k8s.io images pull ghcr.io/bernardtavares/bevox-meta-api:<sha>\` no host (pacote público, sem auth)."
            echo "Imagens antigas \`ghcr.io/bevox/*\` permanecem válidas até migração de manifests."
          } >> "$GITHUB_STEP_SUMMARY"
