# NetworkPolicy — meta-api é serviço interno do grupo Bevox.
#
# Aceita ingress de:
#   1. Apps internos da família Bevox em namespaces rotulados `bevox-internal: "true"`.
#   2. Cloudflare Tunnel (cloudflared) rodando no MESMO namespace, identificado
#      pelo label `bevox-meta-api/role: ingress` no pod. CF termina TLS no edge
#      e encaminha webhooks Meta + chamadas de consumers para o Service.
#
# AJUSTAR conforme seu setup de rede (Cilium, Calico, etc).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bevox-meta-api-ingress
  namespace: bevox-meta-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bevox-meta-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Apps internos do grupo Bevox em namespaces marcados.
    - from:
        - namespaceSelector:
            matchLabels:
              bevox-internal: "true"
      ports:
        - protocol: TCP
          port: 3000
    # Cloudflare Tunnel no mesmo namespace (entrada pública via CF edge).
    - from:
        - podSelector:
            matchLabels:
              bevox-meta-api/role: ingress
      ports:
        - protocol: TCP
          port: 3000
    # A17 fix: kube-prometheus-stack no namespace `monitoring` precisa scrape
    # /metrics dos pods workers em :9090. Sem este allow, ServiceMonitor
    # resolveria endpoints mas o tráfego TCP era dropado.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 3000
  egress:
    # DNS interno
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Postgres/Redis (managed) — geralmente fora do cluster, libera 5432/6379.
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    # Saída para Meta Graph API + KMS (HTTPS).
    - ports:
        - protocol: TCP
          port: 443
