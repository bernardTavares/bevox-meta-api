apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bevox-meta-api
  namespace: bevox-meta-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bevox-meta-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
