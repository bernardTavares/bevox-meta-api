# Deployment do API server.
#
# - 2 replicas + RollingUpdate(maxUnavailable=0,maxSurge=1) = zero-downtime
#   roll. Em cax11 single-node, ambas as replicas rodam no mesmo node — sem
#   HA física. Migrar pra cax21/multi-node fica pra V2.
# - readOnlyRootFilesystem com emptyDir em /tmp e /home/bevox/.cache (tsx +
#   corepack). Ver gotcha §5 do plano go-live.
# - KMS WIF (audience https://kubernetes.default.svc, ConfigMap
#   gcp-wif-credential, serviceAccount bevox-meta-api-kms). Ver §5 do plano
#   e docs/runbooks/gcp-kms-provisioning-v1.md.
# - Probes /healthz (shallow, fast) e /readyz (deep: postgres + redis + KMS).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bevox-meta-api
  namespace: bevox-meta-api
  labels:
    app.kubernetes.io/name: bevox-meta-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bevox-meta-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bevox-meta-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: bevox-meta-api-kms
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: api
          # Substituir tag pelo SHA do build atual; imagem importada local
          # no containerd via `docker save | ctr -n k8s.io images import`.
          image: ghcr.io/bernardtavares/bevox-meta-api:dbe9fd6
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: bevox-meta-api-config }
            - secretRef: { name: bevox-meta-api-secret }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: corepack-cache, mountPath: /home/bevox/.cache }
            - { name: gcp-wif-credential, mountPath: /var/secrets/gcp, readOnly: true }
            - { name: gcp-tokens, mountPath: /var/run/secrets/gcp-tokens, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: corepack-cache, emptyDir: {} }
        - name: gcp-wif-credential
          configMap: { name: gcp-wif-credential }
        - name: gcp-tokens
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: https://kubernetes.default.svc
                  expirationSeconds: 3600
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: bevox-meta-api
  namespace: bevox-meta-api
  labels:
    app.kubernetes.io/name: bevox-meta-api
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bevox-meta-api
    app.kubernetes.io/component: api
  ports:
    - { name: http, port: 80, targetPort: http }
