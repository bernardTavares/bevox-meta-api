# 4 worker deployments (outbound dispatcher, webhook delivery, token refresh,
# cleanup). Cada um é processo separado pra isolar falhas.
#
# Gotcha §1.4 do plano go-live: imagem `runtime` roda via `tsx`, NÃO via
# `dist/`. Workers usam `node --import tsx/esm src/workers/<X>.ts`.
#
# Gotcha §1.5: readOnlyRootFilesystem exige emptyDir em /tmp (socket tsx) e
# /home/bevox/.cache (corepack).
#
# KMS WIF idêntico ao deployment-api (workers usam tokens cifrados também:
# outbound dispatcher decifra antes de cada call Meta; token-refresh idem).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bevox-meta-api-worker-out
  namespace: bevox-meta-api
  labels:
    app.kubernetes.io/name: bevox-meta-api
    app.kubernetes.io/component: worker-out
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bevox-meta-api
      app.kubernetes.io/component: worker-out
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bevox-meta-api
        app.kubernetes.io/component: worker-out
        # A17 fix: label compartilhada (`tier=worker`) que o Service
        # `bevox-meta-api-workers` seleciona para agrupar todos os 5 workers
        # sob o mesmo ServiceMonitor.
        example.com/tier: worker
    spec:
      serviceAccountName: bevox-meta-api-kms
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: worker
          image: ghcr.io/bernardtavares/bevox-meta-api:dbe9fd6
          imagePullPolicy: Never
          command: ["node", "--import", "tsx/esm", "src/workers/outbound-dispatcher.ts"]
          envFrom:
            - configMapRef: { name: bevox-meta-api-config }
            - secretRef: { name: bevox-meta-api-secret }
          # A17 fix: /metrics HTTP listener (porta WORKER_METRICS_PORT).
          # Sem esta porta, ServiceMonitor não scrape e métricas BullMQ
          # ficavam invisíveis ao Prometheus.
          ports:
            - { name: metrics, containerPort: 9090, protocol: TCP }
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { cpu: 500m, memory: 384Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: corepack-cache, mountPath: /home/bevox/.cache }
            - { name: gcp-wif-credential, mountPath: /var/secrets/gcp, readOnly: true }
            - { name: gcp-tokens, mountPath: /var/run/secrets/gcp-tokens, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: corepack-cache, emptyDir: {} }
        - { name: gcp-wif-credential, configMap: { name: gcp-wif-credential } }
        - name: gcp-tokens
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: https://kubernetes.default.svc
                  expirationSeconds: 3600
      terminationGracePeriodSeconds: 30
---
