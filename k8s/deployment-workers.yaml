apiVersion: apps/v1
kind: Deployment
metadata:
  name: bevox-meta-api-worker-media
  namespace: bevox-meta-api
  labels:
    app.kubernetes.io/name: bevox-meta-api
    app.kubernetes.io/component: worker-media
spec:
  # Consumidor BullMQ standalone — produzido por inbound/service.ts a cada mensagem
  # com mídia (audio/video/image/document). Sem este Deployment, jobs ficam órfãos
  # no Redis até esgotar attempts; GET /v1/media/<id> devolve 202 permanentemente.
  # Ref auditoria 2026-06-02 C2.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bevox-meta-api
      app.kubernetes.io/component: worker-media
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bevox-meta-api
        app.kubernetes.io/component: worker-media
        example.com/tier: worker
    spec:
      serviceAccountName: bevox-meta-api-kms
      automountServiceAccountToken: true
      securityContext: { runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001 }
      containers:
        - name: worker
          image: ghcr.io/bernardtavares/bevox-meta-api:dbe9fd6
          imagePullPolicy: Never
          command: ["node", "--import", "tsx/esm", "src/workers/media-download.ts"]
          envFrom:
            - configMapRef: { name: bevox-meta-api-config }
            - secretRef: { name: bevox-meta-api-secret }
          ports:
            - { name: metrics, containerPort: 9090, protocol: TCP }
          resources:
            # Mídia até ~16MB (limite Meta) — baixa CPU, memória ligeiramente
            # maior que outros workers (buffer durante download/upload S3).
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: corepack-cache, mountPath: /home/bevox/.cache }
            - { name: gcp-wif-credential, mountPath: /var/secrets/gcp, readOnly: true }
            - { name: gcp-tokens, mountPath: /var/run/secrets/gcp-tokens, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: corepack-cache, emptyDir: {} }
        - { name: gcp-wif-credential, configMap: { name: gcp-wif-credential } }
        - name: gcp-tokens
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: https://kubernetes.default.svc
                  expirationSeconds: 3600
      terminationGracePeriodSeconds: 30
