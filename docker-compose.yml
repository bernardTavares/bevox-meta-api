# bevox-meta-api — stack local de desenvolvimento.
#
# Sobe Postgres 16 + Redis 7 isolados (dedicados ao meta-api, conforme CLAUDE.md §4).
# A API e os workers rodam localmente via `pnpm dev` / `pnpm worker:*` por padrão.
# Para subir a API containerizada, use `docker compose --profile app up`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: bevox-meta-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bevox_meta_api
      POSTGRES_USER: bevox
      POSTGRES_PASSWORD: bevox_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bevox -d bevox_meta_api"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bevox-meta-api-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bevox-meta-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"

  worker-out:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bevox-meta-api-worker-out
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    command: ["node", "--import", "tsx/esm", "src/workers/outbound-dispatcher.ts"]

  worker-in:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bevox-meta-api-worker-in
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    command: ["node", "--import", "tsx/esm", "src/workers/webhook-delivery.ts"]

  worker-tok:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bevox-meta-api-worker-tok
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    command: ["node", "--import", "tsx/esm", "src/workers/token-refresh.ts"]

  worker-cleanup:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bevox-meta-api-worker-cleanup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    command: ["node", "--import", "tsx/esm", "src/workers/cleanup.ts"]

volumes:
  postgres_data:
  redis_data:
